version: '3.8'

services:
  website-logistik-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: website_logistik_frontend
    ports:
      - "8096:80" # Port 8096 dipilih karena belum digunakan berdasarkan daftar podman ps Anda
    restart: unless-stopped
    networks:
      - logistik_network

networks:
  logistik_network:
    driver: bridge
